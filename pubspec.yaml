name: finance_tracker
description: Personal Finance Tracker with cloud sync (Supabase) and offline support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / cloud sync
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Offline local cache
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Connectivity detection for auto-sync
  connectivity_plus: ^6.0.3

  # Charts (donut + bar/line)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
